<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#07132f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
<title>中秋快乐！❤</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#061331;
}
body{
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none;
}

/* =========================================================
   OPPO Reno12 ONLY
   Design canvas = 1080 × 2412 px (portrait).
   The whole webpage is this single fixed aspect ratio.
   ========================================================= */
.scene{
  position:fixed;
  left:50%;
  top:50%;
  width:min(100vw, calc(100dvh * 1080 / 2412));
  height:min(100dvh, calc(100vw * 2412 / 1080));
  aspect-ratio:1080 / 2412;
  transform:translate(-50%,-50%);
  overflow:hidden;
  background:#061331;
  isolation:isolate;
}

/* Background artwork already has exactly 1080×2412 proportions. */
.art{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  object-fit:fill;
  z-index:0;
  transform:scale(1.008);
  transform-origin:center;
  animation:slowZoom 16s ease-in-out infinite alternate;
  will-change:transform;
}

/* Animated stars are relative to the fixed Reno12 canvas,
   so their positions do not change with another device. */
.stars,
.stars::before,
.stars::after{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  content:"";
  background-image:
    radial-gradient(circle,rgba(255,255,255,.95) 0 1.5px,transparent 2.4px),
    radial-gradient(circle,rgba(255,230,155,.85) 0 1.2px,transparent 2px);
  background-size:82px 97px,137px 151px;
  background-position:15px 30px,47px 71px;
  opacity:.38;
  animation:twinkle 4s ease-in-out infinite alternate;
}
.stars::before{
  opacity:.24;
  transform:translate(31px,45px);
  animation:starMove 20s linear infinite,twinkle 5s ease-in-out infinite alternate;
}
.stars::after{
  opacity:.20;
  transform:translate(-27px,18px);
  animation:starMoveReverse 27s linear infinite,twinkle 6s ease-in-out infinite alternate;
}

/* Lanterns: fixed positions in the Reno12 coordinate system. */
.lantern{
  position:absolute;
  z-index:4;
  width:54px;
  height:68px;
  border-radius:48% 48% 44% 44%;
  background:linear-gradient(90deg,#d94b38,#ffb65b 45%,#e84938);
  box-shadow:0 0 25px rgba(255,174,85,.65);
  opacity:.82;
  animation:float 5.8s ease-in-out infinite;
}
.lantern::before{
  content:"";
  position:absolute;
  left:50%;
  top:-20px;
  width:2px;
  height:21px;
  background:#ffd37b;
  transform:translateX(-50%);
}
.lantern::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:-22px;
  width:3px;
  height:24px;
  background:#e8a14d;
  transform:translateX(-50%);
  box-shadow:-7px 13px 0 -1px #e8a14d,7px 13px 0 -1px #e8a14d;
}
.l1{left:45px;top:310px;transform:scale(.70);animation-delay:-1s}
.l2{right:40px;top:720px;transform:scale(.56);animation-delay:-3s}
.l3{right:120px;bottom:420px;transform:scale(.45);opacity:.52;animation-delay:-2s}

.vignette{
  position:absolute;
  z-index:5;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(180deg,rgba(2,8,28,.22),transparent 16%,transparent 80%,rgba(2,7,25,.25)),
    radial-gradient(ellipse at center,transparent 55%,rgba(2,7,25,.18) 100%);
}

/* Bottom message lives in the fixed Reno12 canvas, not in vw/vh. */
.hint{
  position:absolute;
  z-index:6;
  left:25px;
  right:25px;
  top:30px;

  color:rgba(255,247,210,.94);
  font-size:15px;
  line-height:1.2;
  text-align:center;
  letter-spacing:3px;

  white-space:nowrap;

  text-shadow:0 3px 12px rgba(0,0,0,.65);

  animation:fade 2s ease both;
}

.greeting{
  position:absolute;
  z-index:7;
  left:32px;
  right:32px;
  bottom:58px;

  padding:14px 12px 16px;

  text-align:center;

  border:1px solid rgba(255,236,178,.40);
  border-radius:28px;

  background:rgba(7,20,51,.48);

  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);

  box-shadow:
    0 12px 36px rgba(0,0,0,.25),
    inset 0 0 24px rgba(255,220,140,.08);

  animation:rise 1.3s ease-out both;
}

.greeting h1{
  margin:0;
  color:#fff0b0;
  font-size:33px;
  line-height:1.1;
  letter-spacing:3px;
  white-space:nowrap;
}

.greeting p{
  margin:5px 0 0;
  color:rgba(255,255,255,.92);
  font-size:11px;
  line-height:1.3;
  letter-spacing:1px;
  white-space:nowrap;
}
.heart{
  display:inline-block;
  color:#ff7b88;
  animation:heartBeat 1.2s ease-in-out infinite;
}
.mooncake-hotspot{
  position:absolute;
  z-index:8;
  cursor:pointer;
  /* 测试时显示点击区域 */
  background:rgba(255,0,0,.25);
  border:3px solid rgba(255,255,0,.9);
  border-radius:50%;
}


/* 三个月饼的位置 */
.mooncake1{
  left:100px;
  top:1300px;
  width:250px;
  height:250px;
}

.mooncake2{
  left:415px;
  top:1300px;
  width:250px;
  height:250px;
}

.mooncake3{
  left:730px;
  top:1300px;
  width:250px;
  height:250px;
}


/* 点击后的发光效果 */
.mooncake-hotspot.collected::before{
  content:"";

  position:absolute;
  left:5%;
  top:5%;
  width:90%;
  height:90%;

  border-radius:50%;

  background:radial-gradient(
    circle,
    rgba(255,240,160,.45) 0%,
    rgba(255,210,90,.25) 35%,
    rgba(255,190,50,.12) 55%,
    transparent 75%
  );

  box-shadow:
    0 0 20px rgba(255,225,120,.7),
    0 0 45px rgba(255,195,60,.5),
    0 0 80px rgba(255,180,40,.3);

  animation:moonshine 1.2s ease-in-out infinite alternate;

  pointer-events:none;
}


/* 发光呼吸效果 */
@keyframes moonshine{
  from{
    opacity:.55;
    transform:scale(.95);
  }

  to{
    opacity:1;
    transform:scale(1.08);
  }
}


/* 已经点击的月饼不再重复触发 */
.mooncake-hotspot.collected{
  pointer-events:none;
}

  
@keyframes slowZoom{
  from{transform:scale(1.008)}
  to{transform:scale(1.025)}
}
@keyframes twinkle{from{opacity:.18}to{opacity:.62}}
@keyframes starMove{from{margin-top:-8px}to{margin-top:12px}}
@keyframes starMoveReverse{from{margin-top:10px}to{margin-top:-10px}}
@keyframes float{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-18px) rotate(2deg)}
}
@keyframes rise{
  from{opacity:0;transform:translateY(28px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes heartBeat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.28)}
}

/* No desktop layout and no landscape layout:
   the Reno12 portrait canvas remains the design target. */
</style>
</head>

  <div class="mooncake-hotspot mooncake3" onclick="collectMooncake(3)"></div>

  <div class="hint">✦ 月圆 · 花香 · 灯暖 · 团圆 ✦</div>

  <div class="greeting">
    <h1>中秋快乐！ <span class="heart">❤</span></h1>
    <p>愿你所念皆如愿，所行皆坦途 · 月圆人团圆</p>
  </div>
</div>
<script>
const collectedMooncakes = new Set();

function collectMooncake(number){

  const target = document.querySelector(".mooncake" + number);

  /* 同一个月饼不能重复点击 */
  if(collectedMooncakes.has(number)){
    return;
  }

  /* 记录已经点击 */
  collectedMooncakes.add(number);

  /* 点击后发光 */
  target.classList.add("collected");

  console.log("点击了月饼：" + number);
  console.log("当前已找到：" + collectedMooncakes.size + "/3");
}
</script>
</body>
</html>
